# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with check_sql.
# See https://github.com/Query-farm/vgi-lint-check (VGI920).
# These need a live Slack workspace: attach with a real token before running --ai.
tasks:
  - name: member_channels
    reference_sql: SELECT name FROM slack.main.channels() WHERE is_member ORDER BY name
  - name: general_message_count
    reference_sql: SELECT count(*) AS messages FROM slack.main.messages('#general')
  - name: top_poster
    reference_sql: >-
      SELECT u.real_name FROM slack.main.messages('#general') m
      JOIN slack.main.users() u ON u.id = m.user_id
      GROUP BY u.real_name ORDER BY count(*) DESC LIMIT 1
  - name: bot_identity
    reference_sql: SELECT team FROM slack.main.auth_info()
  # Table function arguments must be constants, so an agent finds the thread first
  # and then reads it with replies(). The grader cannot call replies() with a computed
  # ts, so it checks the saved answer instead: its replies (rows that are not top-level
  # history, except replies also sent to the channel; the parent may be included or not)
  # must number exactly the busiest thread's reply_count, with no duplicates.
  - name: busiest_thread
    check_sql: >-
      SELECT count(*) FILTER (WHERE ts NOT IN (SELECT ts FROM slack.main.messages('#general')
                                               WHERE thread_ts IS NULL OR thread_ts = ts))
               = (SELECT max(reply_count) FROM slack.main.messages('#general'))
        AND count(*) = count(DISTINCT ts)
      FROM busiest_thread
  # Composed: messages() joined to users() for the author's time zone. The agent saves its
  # answer as general_by_tz; the grader recomputes it from the API and requires the two
  # sets to be identical (and non-empty), so a wrong count, tz or missing row fails.
  - name: general_messages_by_tz
    check_sql: >-
      WITH truth AS (
        SELECT u.tz, count(*) AS messages
        FROM slack.main.messages('#general', oldest := TIMESTAMPTZ '2026-01-01 00:00:00+00',
                                 latest := TIMESTAMPTZ '2026-01-31 23:59:59.999999+00') m
        JOIN slack.main.users(include_deleted := true) u ON u.id = m.user_id
        WHERE NOT u.is_bot GROUP BY u.tz)
      SELECT (SELECT count(*) FROM truth) > 0
        AND NOT EXISTS (SELECT tz, messages::BIGINT FROM general_by_tz EXCEPT SELECT tz, messages FROM truth)
        AND NOT EXISTS (SELECT tz, messages FROM truth EXCEPT SELECT tz, messages::BIGINT FROM general_by_tz)
