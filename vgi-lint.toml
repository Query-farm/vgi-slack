# vgi-lint settings for this worker: https://github.com/Query-farm/vgi-lint-check
# `make lint-explain`, `vgi-lint lint` in this directory, and CI's metadata job all
# read this file. Look up a rule with `vgi-lint explain VGI123`; print the metadata tag
# contract with `vgi-lint spec`.

# The worker to attach, relative to this directory. Build it first with `make build`.
location = "bin/vgi-slack-worker"

# Fail on warnings while you build. Raise this to "info" before you publish the worker.
fail_on = "warning"

# Waive a finding only with a kind and a reason, so the waiver can be audited:
#   domain-exemption  permanent and legitimate for this worker
#   deferred          a real defect you will fix; add expires = "YYYY-MM-DD"
#   timing            slow or flaky because of the environment, not the metadata
#   tooling-bug       the linter is wrong; report it upstream
ignore = [
  # { code = "VGI146", kind = "domain-exemption", reason = "every entry point needs a key" },
]

# Adopting the gate on a worker that already has findings? Record them once with
#   vgi-lint lint --baseline vgi-lint-baseline --update-baseline
# and uncomment the next line. Only new findings fail after that.
# baseline = "vgi-lint-baseline"

# Per-object waivers: each scoped to the objects it is about, with its reason.
[per_object."slack.main.post_message"]
ignore = [
  { code = "VGI520", kind = "domain-exemption", reason = "posts a real Slack message; an automated agent-grading run against a live workspace must not send messages" },
]

[per_object."slack.main.post_messages"]
ignore = [
  { code = "VGI520", kind = "domain-exemption", reason = "posts real Slack messages; an automated agent-grading run against a live workspace must not send messages" },
]

[per_object."slack.main.replies"]
ignore = [
  { code = "VGI520", kind = "domain-exemption", reason = "needs a thread ts from the live workspace and DuckDB table-function arguments cannot be subqueries, so no fixed grader can call it; the busiest_thread task exercises it through the agent" },
]

[per_object."slack.main.auth_info"]
ignore = [
  { code = "VGI311", kind = "domain-exemption", reason = "a live auth.test connectivity check whose row depends on the attaching token, not a dataset; a view wrapper is rejected by VGI145" },
]
